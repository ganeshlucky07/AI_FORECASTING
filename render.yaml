# Render.com blueprint: backend-only deployment for AI Forecasting API
# Frontend is deployed separately on Vercel
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-forecasting-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: SERVE_FRONTEND
        value: "0"
      - key: CORS_ORIGINS
        value: "*"
      # Optional: Add your Vercel frontend URL here after deployment for security
      # - key: CORS_ORIGINS
      #   value: https://your-frontend.vercel.app
      # Optional: Use PostgreSQL instead of SQLite for persistence
      # - key: DATABASE_URL
      #   sync: false
